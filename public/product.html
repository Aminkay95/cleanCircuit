<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SLA Flow — Private Staging</title><link rel="stylesheet" href="/product.css"></head>
<body><main>
  <header><div><span class="eyebrow">PRIVATE STAGING · SANDBOX INTEGRATIONS</span><h1>SLA Flow</h1></div><nav><a href="/validate">Validation-page preview</a> · <a href="/">Agency control room</a></nav></header>
  <section class="hero"><div><p class="eyebrow">CLEANING OPERATIONS</p><h2>From quote to deposit,<br>without a dropped hand-off.</h2><p>One operational timeline for small cleaning teams.</p></div><div class="auth"><label>Admin token<input id="token" type="password"></label><span id="auth-status"></span></div></section>
  <section class="layout"><form id="quote-form" class="panel"><h3>New service quote</h3><label>Customer name<input name="customerName" required></label><label>Email<input name="customerEmail" type="email" required></label><label>Service address<input name="serviceAddress" required></label><label>Service description<textarea name="description" required></textarea></label><div class="two"><label>Service date<input name="serviceDate" type="date" required></label><label>Total (USD)<input name="amount" type="number" min="0" step="0.01" required></label></div><label>Deposit (USD)<input name="deposit" type="number" min="0" step="0.01" required></label><button>Create draft quote</button></form><section><div class="section-title"><h3>Active jobs</h3><button id="refresh" class="secondary">Refresh</button></div><div id="jobs"></div></section></section>
</main><template id="job-template"><article class="job panel"><div class="job-head"><div><span class="quote-number"></span><h3 class="customer"></h3></div><span class="amount"></span></div><p class="description"></p><div class="steps"></div><details><summary>Timeline</summary><ul class="timeline"></ul></details></article></template><script src="/product.js"></script></body></html>
